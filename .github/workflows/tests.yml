name: tests
on: [push, pull_request]
jobs:
  selftests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libgl1
      - run: pip install -e .
      # The self-tests that need no COLMAP and no camera. test_walkaround, test_replay and test_colmap need pycolmap
      # (pip install -e ".[sfm]") and minutes of run time; they are not run here yet.
      - run: |
          for t in test_profile test_score test_slidescan test_geometry test_grazing test_sled; do
            echo "== $t"; python $t.py
          done
